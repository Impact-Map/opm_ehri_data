name: Daily OPM Data Check

on:
  schedule:
    - cron: '0 14 * * *'  # 10 AM ET
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Run in test mode (January 2026 only, full report/email)'
        required: false
        default: 'false'
        type: boolean
      chain_depth:
        description: 'Internal: incremented when one blocked run chains another. Leave alone for normal manual runs.'
        required: false
        default: '0'

permissions:
  contents: write
  issues: write
  actions: write  # needed for the chain-on-block step (gh workflow run)

concurrency:
  group: opm-daily
  # Queue overlapping runs instead of killing one to start another. Previously
  # a delayed scheduled cron killed a long-running manual catch-up; with this
  # set to false the scheduled run waits politely until any in-flight run
  # finishes (worst case: scheduled run starts a bit late).
  cancel-in-progress: false

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    # 6h is the GitHub-hosted runner cap. Normal daily runs finish in ~2 minutes,
    # but a full OPM v2->v3 refresh (~700 files) needs the headroom.
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Smoke test - verify OPM download and data quality
        # Skip on chained runs (chain_depth > 0). The smoke test downloads
        # one file from OPM, which costs an IP-budget request before the
        # real work even starts. On the first run of a chain that's fine;
        # on subsequent chained runs we already proved connectivity and
        # don't want to waste a request just to re-prove it.
        if: github.event.inputs.chain_depth == '' || github.event.inputs.chain_depth == '0'
        run: python smoke_test.py

      - name: Run daily pipeline
        id: pipeline
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          TEST_FLAG=""
          if [ "${{ github.event.inputs.test_mode }}" = "true" ]; then
            TEST_FLAG="--test"
          fi
          python run_daily.py $TEST_FLAG 2>&1 | tee pipeline_output.txt

      - name: Commit manifest changes
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add metadata/
          if ! git diff --staged --quiet; then
            git commit -m "Update file manifest [automated]"
            git pull --rebase origin main
            git push
          fi

      - name: Run anomaly detection
        # Skip on blocked runs — there's no point running anomaly detection on
        # a partial batch since the chained run will produce the complete one.
        if: success() && steps.pipeline.outputs.has_changes == 'true' && steps.pipeline.outputs.pipeline_status != 'blocked'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python run_anomaly.py --changed "${{ steps.pipeline.outputs.changed_keys }}" --baseline 202412

      - name: Commit anomaly findings
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          if ! git diff --staged --quiet; then
            git commit -m "Update anomaly findings [automated]"
            git pull --rebase origin main
            git push
          fi

      - name: Send Buttondown email notification
        if: always() && steps.pipeline.outcome == 'success' && steps.pipeline.outputs.has_changes == 'true' && steps.pipeline.outputs.pipeline_status != 'blocked'
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          EMAIL_SUBJECT: ${{ steps.pipeline.outputs.email_subject }}
        run: python3 send_email.py

      - name: Chain a fresh run if IP throttled
        # Pattern lifted from pull_usaspending: when downloads consistently
        # fail in a row, the python step sets pipeline_status=blocked and
        # exits 0. We trigger another workflow run, which lands on a different
        # GitHub-hosted runner (different IP) and picks up where this one
        # stopped via sync_manifest_with_hf at startup. Email is suppressed
        # above on blocked runs so subscribers don't get a partial summary —
        # the chained run will send the full one when everything's done.
        # chain_depth is a safety: if 10 chained runs in a row all blocked,
        # something other than IP rotation is wrong — stop and surface it.
        # Use always() rather than success() because we want to chain even if
        # an unrelated downstream step (e.g. anomaly detection on partial data)
        # failed — the only thing that matters is the pipeline reported blocked.
        if: always() && steps.pipeline.outputs.pipeline_status == 'blocked'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DEPTH="${{ github.event.inputs.chain_depth || '0' }}"
          NEXT=$((DEPTH + 1))
          if [ "$NEXT" -gt 10 ]; then
            echo "Reached max chain depth (10) — refusing to chain further. Investigate manually."
            exit 1
          fi
          echo "Pipeline reported pipeline_status=blocked — triggering a fresh run on a new runner IP (chain depth $NEXT)"
          gh workflow run daily_check.yml \
            --repo ${{ github.repository }} \
            -f chain_depth=$NEXT

      - name: Create failure issue with full output
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PIPELINE_OUTPUT: pipeline_output.txt
        run: |
          BODY=$(cat <<'ISSUE_EOF'
          ## Pipeline Failed

          The daily OPM data check failed. Full output is below — no need to dig into the Actions log.

          ### Full Pipeline Output

          ```
          ISSUE_EOF
          )

          if [ -f pipeline_output.txt ]; then
            # Truncate to 60000 chars to stay under GitHub issue body limit
            OUTPUT=$(head -c 60000 pipeline_output.txt)
            BODY="${BODY}
          ${OUTPUT}
          \`\`\`"
          else
            BODY="${BODY}
          (no output captured — the pipeline may have failed before producing any output)
          \`\`\`

          Check the [Actions run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) for details."
          fi

          TITLE="Pipeline FAILED - $(date -u +%Y-%m-%d)"
          echo "$BODY" | gh issue create --title "$TITLE" --body-file -

