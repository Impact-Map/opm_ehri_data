name: Daily OPM Data Check

on:
  schedule:
    # Drift +1h per day-of-week so most run-to-run gaps are 25h instead of 24h.
    # OPM appears to throttle on a rolling 24h window per IP, and locking the
    # cron to a fixed wall-clock time meant we hit the wall every day. Anchored
    # at Fri 14:00 UTC (the original slot); the Thu->Fri wrap is 18h short.
    - cron: '0 14 * * 5'  # Fri
    - cron: '0 15 * * 6'  # Sat
    - cron: '0 16 * * 0'  # Sun
    - cron: '0 17 * * 1'  # Mon
    - cron: '0 18 * * 2'  # Tue
    - cron: '0 19 * * 3'  # Wed
    - cron: '0 20 * * 4'  # Thu
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Run in test mode (January 2026 only, full report/email)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  issues: write
  actions: write  # for the "Chain next run if more files remain" step (gh workflow run)

concurrency:
  group: opm-daily
  # Queue overlapping runs instead of killing one to start another. Previously
  # a delayed scheduled cron killed a long-running manual catch-up; with this
  # set to false the scheduled run waits politely until any in-flight run
  # finishes (worst case: scheduled run starts a bit late).
  cancel-in-progress: false

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    # 6h is the GitHub-hosted runner cap. Normal daily runs finish in ~2 minutes,
    # but a full OPM v2->v3 refresh (~700 files) needs the headroom.
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium

      # Smoke test disabled — it burns one of our limited OPM calls per run
      # before the pipeline even starts. The pipeline itself is the smoke test;
      # if the site layout breaks, it'll fail fast on the first download.
      # - name: Smoke test - verify OPM download and data quality
      #   run: python smoke_test.py

      - name: Run daily pipeline
        id: pipeline
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Cap each run so it exits cleanly under the 6h Actions limit.
          # Real timing: ~7 min per ~1.8GB employment file (download +
          # parquet convert + diff against prior v2). 40 files * 7 min
          # ~= 280 min, leaving ~80 min margin. With chain-next-run
          # wired up, a full ~110 file backlog drains in ~3 runs.
          OPM_MAX_FILES_PER_RUN: '40'
          # Smaller batches so a killed/timed-out run still commits
          # partial progress to HF. 40 files / 20 batch = 2 commits per run.
          UPLOAD_BATCH_SIZE: '20'
        run: |
          set -o pipefail
          TEST_FLAG=""
          if [ "${{ github.event.inputs.test_mode }}" = "true" ]; then
            TEST_FLAG="--test"
          fi
          python run_daily.py $TEST_FLAG 2>&1 | tee pipeline_output.txt

      - name: Commit manifest changes
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add metadata/
          if ! git diff --staged --quiet; then
            git commit -m "Update file manifest [automated]"
            git pull --rebase origin main
            git push
          fi

      # Anomaly detection disabled — was adding ~40 min per run. Federal
      # Workforce Watch page (docs/index.html) still reads existing
      # docs/data/*.json but won't get new months until this is re-enabled.
      # - name: Run anomaly detection
      #   if: success() && steps.pipeline.outputs.has_changes == 'true'
      #   env:
      #     HF_TOKEN: ${{ secrets.HF_TOKEN }}
      #   run: python run_anomaly.py --changed "${{ steps.pipeline.outputs.changed_keys }}" --baseline 202412
      #
      # - name: Commit anomaly findings
      #   if: success()
      #   run: |
      #     git config user.name "github-actions[bot]"
      #     git config user.email "github-actions[bot]@users.noreply.github.com"
      #     git add docs/data/
      #     if ! git diff --staged --quiet; then
      #       git commit -m "Update anomaly findings [automated]"
      #       git pull --rebase origin main
      #       git push
      #     fi

      - name: Send Buttondown email notification
        if: always() && steps.pipeline.outcome == 'success' && steps.pipeline.outputs.success_count != '0' && steps.pipeline.outputs.success_count != ''
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          EMAIL_SUBJECT: ${{ steps.pipeline.outputs.email_subject }}
        run: python3 send_email.py

      # Chain another run if more files are still pending. Fires on full
      # success AND partial success — a phantom URL or a transient network
      # error shouldn't stop the queue from draining. Only stops if NOTHING
      # uploaded this run (likely OPM is actually down).
      - name: Chain next run if more files remain
        if: success() && steps.pipeline.outputs.success_count != '0' && steps.pipeline.outputs.files_remaining != '0' && steps.pipeline.outputs.files_remaining != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering follow-up run (${{ steps.pipeline.outputs.files_remaining }} files still pending)"
          gh workflow run daily_check.yml --ref ${{ github.ref_name }}

      # Renders on the Actions run page directly (no log digging). Always runs.
      - name: Write run summary
        if: always()
        env:
          PIPELINE_STATUS: ${{ steps.pipeline.outputs.pipeline_status }}
          NEW_COUNT: ${{ steps.pipeline.outputs.new_count }}
          UPDATED_COUNT: ${{ steps.pipeline.outputs.updated_count }}
          RECOVERED_COUNT: ${{ steps.pipeline.outputs.recovered_count }}
          SUCCESS_COUNT: ${{ steps.pipeline.outputs.success_count }}
          FAILED_COUNT: ${{ steps.pipeline.outputs.failed_count }}
          FILES_REMAINING: ${{ steps.pipeline.outputs.files_remaining }}
          UPLOADED_KEYS: ${{ steps.pipeline.outputs.uploaded_keys }}
          FAILED_KEYS: ${{ steps.pipeline.outputs.failed_keys }}
          PIPELINE_OUTCOME: ${{ steps.pipeline.outcome }}
        run: |
          {
            echo "# OPM Daily Run — $(date -u +%Y-%m-%d)"
            echo ""
            if [ "$PIPELINE_OUTCOME" != "success" ]; then
              echo "**Pipeline failed** before it could produce results. See \"Run daily pipeline\" step for the error."
              exit 0
            fi
            STATUS_LABEL="$PIPELINE_STATUS"
            if [ "$STATUS_LABEL" = "aborted" ]; then
              STATUS_LABEL="aborted (too many consecutive failures — exited early, tomorrow's run continues)"
            fi
            echo "**Status:** ${STATUS_LABEL:-(no run)}"
            echo "**Uploaded to HuggingFace:** ${SUCCESS_COUNT:-0}"
            echo "**Failed:** ${FAILED_COUNT:-0}"
            echo "**New (calendar months):** ${NEW_COUNT:-0}"
            echo "**Updated (revised versions):** ${UPDATED_COUNT:-0}"
            if [ -n "$RECOVERED_COUNT" ] && [ "$RECOVERED_COUNT" != "0" ]; then
              echo "**Recovered from prior interrupted run:** $RECOVERED_COUNT"
            fi
            if [ -n "$FILES_REMAINING" ] && [ "$FILES_REMAINING" != "0" ]; then
              if [ "${FAILED_COUNT:-0}" = "0" ]; then
                echo "**Files still pending:** $FILES_REMAINING (chained another run)"
              else
                echo "**Files still pending:** $FILES_REMAINING (NOT chained — this run had failures; tomorrow's cron will retry)"
              fi
            fi
            echo ""
            if [ -n "$UPLOADED_KEYS" ]; then
              echo "## Uploaded"
              echo ""
              echo "$UPLOADED_KEYS" | sed 's/^/- /'
              echo ""
            fi
            if [ -n "$FAILED_KEYS" ]; then
              echo "## Failed"
              echo ""
              echo "$FAILED_KEYS" | sed 's/^/- /'
              echo ""
            fi
            echo "## Anomaly detection"
            echo ""
            echo "Disabled (was adding ~40 min per run). Federal Workforce Watch page is frozen at last committed \`docs/data/\` snapshot."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create failure issue with full output
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PIPELINE_OUTPUT: pipeline_output.txt
        run: |
          BODY=$(cat <<'ISSUE_EOF'
          ## Pipeline Failed

          The daily OPM data check failed. Full output is below — no need to dig into the Actions log.

          ### Full Pipeline Output

          ```
          ISSUE_EOF
          )

          if [ -f pipeline_output.txt ]; then
            # Truncate to 60000 chars to stay under GitHub issue body limit
            OUTPUT=$(head -c 60000 pipeline_output.txt)
            BODY="${BODY}
          ${OUTPUT}
          \`\`\`"
          else
            BODY="${BODY}
          (no output captured — the pipeline may have failed before producing any output)
          \`\`\`

          Check the [Actions run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) for details."
          fi

          TITLE="Pipeline FAILED - $(date -u +%Y-%m-%d)"
          echo "$BODY" | gh issue create --title "$TITLE" --body-file -

