name: Test explorer parquet

on:
  push:
    branches: [main]
    paths:
      - 'docs/data/accessions_explorer.parquet'
      - 'build_explorer_data.py'
      - 'tests/**'
  pull_request:
    paths:
      - 'docs/data/accessions_explorer.parquet'
      - 'build_explorer_data.py'
      - 'tests/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install duckdb pytest

      - name: Run parquet tests
        run: python -m pytest tests/test_explorer_parquet.py -v
